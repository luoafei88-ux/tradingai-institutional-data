name: Sync institutional features

on:
  workflow_dispatch:
  schedule:
    # UTC: 17:35, 18:35, 19:35, 20:35 in Asia/Taipei
    - cron: "35 9-12 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest institutional CSV
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            --output institutional_scanner_features.csv \
            "https://drive.usercontent.google.com/download?id=16WyLryZ57-Wj5OcyMDdVlVUYNqFxb48R&export=download&confirm=t"
          test -s institutional_scanner_features.csv
          head -n 1 institutional_scanner_features.csv | grep -q '^as_of,'
      - name: Commit update when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- institutional_scanner_features.csv; then
            echo "No data change."
            exit 0
          fi
          git add institutional_scanner_features.csv
          git commit -m "chore: sync institutional features"
          git push
